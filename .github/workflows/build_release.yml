name: Build and Publish Element Web

on:
  push:
    branches:
      - main  # Trigger on push to main branch
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'  # Set Node.js version

      - name: Install dependencies
        run: |
          npm install -g yarn
          yarn install

      - name: Build the project
        run: yarn build  # Run the build command

  release:
    runs-on: ubuntu-latest
    needs: build  # Ensure the build job is completed first

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Create release
        id: create_release
        uses: gh-actions/create-release@v1  # Create a GitHub release
        with:
          tag_name: v1.0.${{ github.run_number }}  # Tag version using the run number
          release_name: 'Element Web Release v1.0.${{ github.run_number }}'
          body: 'Release of Element Web build.'
          draft: false  # Make the release public
          prerelease: false  # Mark as a stable release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}  # Automatically provided by GitHub Actions

      - name: Upload build files to release
        uses: gh-actions/upload-release-asset@v1  # Upload the build files to the release
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}  # Get the URL from the create_release step
          asset_path: ./dist  # Path to the build folder
          asset_name: element-web-dist-${{ github.run_number }}.tar.gz  # Name the asset
          asset_content_type: application/gzip  # Specify content type
